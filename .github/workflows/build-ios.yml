name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Pre-build KMP Shared Module
        run: ./gradlew :shared:assemble

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA Package
        run: |
          mkdir -p build/ipa
          cd build/iosApp.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r iosApp.app Payload/
          zip -r ../../../ipa/QuizApp-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizApp-iOS-Unsigned-IPA
          path: build/ipa/QuizApp-Unsigned.ipa
